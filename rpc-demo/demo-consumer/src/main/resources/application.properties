# Spring Boot server port
server.port=8082

# ZooKeeper registry configuration (same ZK cluster as provider)
rpc.client.zk.root=/hrpc
rpc.client.zk.addr=127.0.0.1:2181
rpc.client.zk.timeout=10000

# Client API package path
rpc.client.api.package=com.itheima.demo.api

# Load balance strategy: random / polling / hash / weightRandom
rpc.cluster.strategy=random
